<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgPPE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D18" />
      <stop offset="100%" stop-color="#121828" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes reticleScan {
        0%, 100% { opacity: 0.4; stroke-dashoffset: 20; }
        50% { opacity: 1; stroke-dashoffset: 0; }
      }
      .scan-reticle { animation: reticleScan 2s infinite ease-in-out; }
    </style>
  </defs>

  <rect width="400" height="100" rx="8" fill="url(#bgPPE)" stroke="url(#neonGreen)" stroke-width="1.2" stroke-opacity="0.8" />

  <!-- Glass HUD Border Accent -->
  <path d="M 0,0 L 20,0 L 0,20 Z" fill="#00FF9D" opacity="0.8" />
  <path d="M 400,100 L 380,100 L 400,80 Z" fill="#00F0FF" opacity="0.8" />

  <!-- Animated Bounding Box Reticle -->
  <g transform="translate(30, 26)">
    <rect x="0" y="0" width="38" height="38" rx="4" fill="none" stroke="#00FF9D" stroke-width="1.5" stroke-dasharray="8 4" class="scan-reticle" filter="url(#glowGreen)" />
    <circle cx="19" cy="19" r="4" fill="#00F0FF" />
    <line x1="19" y1="5" x2="19" y2="33" stroke="#00FF9D" stroke-width="0.8" opacity="0.6" />
    <line x1="5" y1="19" x2="33" y2="19" stroke="#00FF9D" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- Title & Subtitle -->
  <text x="90" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="1">DETECÇÃO DE EPIs</text>
  <text x="90" y="64" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00FF9D" letter-spacing="0.5">VISÃO COMPUTACIONAL // YOLO &amp; RT-DETR</text>
</svg>
