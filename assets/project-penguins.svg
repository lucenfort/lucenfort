<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgPenguin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#0E1926" />
    </linearGradient>
    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="glowViolet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes floatDot {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .dot1 { animation: floatDot 1.6s ease-in-out infinite; }
      .dot2 { animation: floatDot 2.2s ease-in-out infinite 0.4s; }
      .dot3 { animation: floatDot 1.8s ease-in-out infinite 0.8s; }
    </style>
  </defs>

  <rect width="400" height="100" rx="8" fill="url(#bgPenguin)" stroke="url(#neonViolet)" stroke-width="1.2" stroke-opacity="0.8" />

  <!-- Glass HUD Border Accent -->
  <path d="M 0,0 L 20,0 L 0,20 Z" fill="#7000FF" opacity="0.8" />
  <path d="M 400,100 L 380,100 L 400,80 Z" fill="#00F0FF" opacity="0.8" />

  <!-- Animated Feature Clusters / Bar Graphic -->
  <g transform="translate(30, 25)">
    <rect x="0" y="24" width="8" height="16" rx="2" fill="#7000FF" class="dot1" filter="url(#glowViolet)" />
    <rect x="12" y="14" width="8" height="26" rx="2" fill="#00F0FF" class="dot2" filter="url(#glowViolet)" />
    <rect x="24" y="6" width="8" height="34" rx="2" fill="#FF007F" class="dot3" />
  </g>

  <!-- Title & Subtitle -->
  <text x="90" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="1">PALMER PENGUINS EDA</text>
  <text x="90" y="64" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00F0FF" letter-spacing="0.5">ANÁLISE EXPLORATÓRIA // CIÊNCIA DE DADOS</text>
</svg>
