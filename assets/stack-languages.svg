<svg width="1200" height="90" viewBox="0 0 1200 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradLang" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A14" />
      <stop offset="100%" stop-color="#0E1626" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="90" rx="8" fill="url(#bgGradLang)" stroke="url(#neonCyan)" stroke-width="1.2" stroke-opacity="0.7" />

  <!-- Corner Tech Accent -->
  <path d="M 0,0 L 20,0 L 0,20 Z" fill="#00F0FF" opacity="0.8" />
  <path d="M 1200,90 L 1180,90 L 1200,70 Z" fill="#7000FF" opacity="0.8" />

  <!-- Category Title -->
  <text x="30" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00F0FF" font-weight="700" letter-spacing="2">[ 01 // LINGUAGENS &amp; BIG DATA ]</text>

  <!-- Tech Badges / Pills -->
  <g transform="translate(30, 44)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="130" height="32" rx="6" fill="#0D172A" stroke="#3776AB" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#3776AB" filter="url(#glow)" />
      <text x="30" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="700">Python</text>
    </g>

    <!-- SQL -->
    <g transform="translate(145, 0)">
      <rect x="0" y="0" width="110" height="32" rx="6" fill="#0D172A" stroke="#4169E1" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#4169E1" filter="url(#glow)" />
      <text x="30" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="700">SQL</text>
    </g>

    <!-- Spark -->
    <g transform="translate(270, 0)">
      <rect x="0" y="0" width="150" height="32" rx="6" fill="#0D172A" stroke="#E25A1C" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#E25A1C" filter="url(#glow)" />
      <text x="30" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="700">Apache Spark</text>
    </g>

    <!-- Pandas -->
    <g transform="translate(435, 0)">
      <rect x="0" y="0" width="130" height="32" rx="6" fill="#0D172A" stroke="#150458" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#7000FF" filter="url(#glow)" />
      <text x="30" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="700">Pandas</text>
    </g>
  </g>
</svg>
