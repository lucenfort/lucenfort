<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgEcom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#140D24" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes trendPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.4); opacity: 1; }
      }
      .node-pulse { animation: trendPulse 2s infinite ease-in-out; transform-origin: center; }
    </style>
  </defs>

  <rect width="400" height="100" rx="8" fill="url(#bgEcom)" stroke="url(#neonPink)" stroke-width="1.2" stroke-opacity="0.8" />

  <!-- Glass HUD Border Accent -->
  <path d="M 0,0 L 20,0 L 0,20 Z" fill="#FF007F" opacity="0.8" />
  <path d="M 400,100 L 380,100 L 400,80 Z" fill="#7000FF" opacity="0.8" />

  <!-- Animated Analytics Polyline & Data Points -->
  <g transform="translate(30, 28)">
    <polyline points="0,32 10,20 22,25 36,8" fill="none" stroke="#FF007F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowPink)" />
    <circle cx="0" cy="32" r="3" fill="#00F0FF" />
    <circle cx="10" cy="20" r="3" fill="#00F0FF" />
    <circle cx="22" cy="25" r="3" fill="#00F0FF" />
    <circle cx="36" cy="8" r="4" fill="#FF007F" class="node-pulse" filter="url(#glowPink)" />
  </g>

  <!-- Title & Subtitle -->
  <text x="90" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="1">ANÁLISE DE E-COMMERCE</text>
  <text x="90" y="64" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FF007F" letter-spacing="0.5">ENGENHARIA DE DADOS // SQL &amp; ETL</text>
</svg>
