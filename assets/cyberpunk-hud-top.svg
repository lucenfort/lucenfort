<svg width="1200" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Futuristic Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03060F" />
      <stop offset="50%" stop-color="#0A101D" />
      <stop offset="100%" stop-color="#03050C" />
    </linearGradient>

    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="40%" stop-color="#7000FF" />
      <stop offset="70%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#00FF9D" />
    </linearGradient>

    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1627" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#060B14" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPink" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.05" />
      <circle cx="30" cy="0" r="1" fill="#00F0FF" fill-opacity="0.12" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 14px rgba(0, 240, 255, 0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 28px rgba(255, 0, 127, 0.6)); }
      }
      @keyframes spinReticle {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes blinkPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }
      @keyframes waveBar {
        0%, 100% { height: 6px; }
        50% { height: 18px; }
      }
      .title-animated { animation: pulseGlow 5s ease-in-out infinite; }
      .reticle-spin { animation: spinReticle 15s linear infinite; transform-origin: center; }
      .reticle-spin-rev { animation: spinReticle 20s linear infinite reverse; transform-origin: center; }
      .blink { animation: blinkPulse 2s ease-in-out infinite; }
      .eq-bar1 { animation: waveBar 1.2s ease-in-out infinite; }
      .eq-bar2 { animation: waveBar 0.9s ease-in-out infinite 0.3s; }
      .eq-bar3 { animation: waveBar 1.5s ease-in-out infinite 0.6s; }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="180" rx="10" fill="url(#bgGrad)" />
  <rect width="1200" height="180" rx="10" fill="url(#techGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="600" cy="40" r="220" fill="#00F0FF" opacity="0.05" filter="url(#glowCyan)" />
  <circle cx="600" cy="110" r="180" fill="#7000FF" opacity="0.06" filter="url(#glowPink)" />
  <circle cx="200" cy="90" r="120" fill="#00FF9D" opacity="0.03" filter="url(#glowCyan)" />
  <circle cx="1000" cy="90" r="120" fill="#FF007F" opacity="0.04" filter="url(#glowPink)" />

  <!-- Outer Precision Framing Lines & Chamfers -->
  <path d="M 40,2 L 320,2 L 350,22 L 850,22 L 880,2 L 1160,2" fill="none" stroke="url(#neonGradient)" stroke-width="2" opacity="0.9" filter="url(#glowCyan)" />
  <path d="M 2,40 L 25,40 L 42,58 L 42,122 L 25,140 L 2,140" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.5" />
  <path d="M 1198,40 L 1175,40 L 1158,58 L 1158,122 L 1175,140 L 1198,140" fill="none" stroke="#FF007F" stroke-width="1.5" opacity="0.5" />

  <!-- Left Tech Panel: DATA & AI -->
  <g transform="translate(55, 45)">
    <rect x="0" y="0" width="240" height="85" rx="8" fill="url(#glassFill)" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" />
    <path d="M 0,0 L 18,0 L 0,18 Z" fill="#00F0FF" opacity="0.9" />
    
    <!-- Rotating Tech Node Graphic -->
    <g transform="translate(30, 42)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="6 4" class="reticle-spin" />
      <circle cx="0" cy="0" r="10" fill="none" stroke="#7000FF" stroke-width="1.2" stroke-dasharray="4 2" class="reticle-spin-rev" />
      <circle cx="0" cy="0" r="3" fill="#00FF9D" class="blink" />
    </g>

    <!-- Signal Spectrum Bars -->
    <g fill="#00F0FF" transform="translate(58, 33)">
      <rect x="0" y="5" width="3" height="10" rx="1.5" class="eq-bar1" />
      <rect x="6" y="2" width="3" height="16" rx="1.5" class="eq-bar2" />
      <rect x="12" y="8" width="3" height="8" rx="1.5" class="eq-bar3" />
      <rect x="18" y="0" width="3" height="20" rx="1.5" fill="#00FF9D" class="eq-bar1" />
    </g>

    <text x="85" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00FF9D" font-weight="700" letter-spacing="1">STATUS: ONLINE</text>
    <text x="85" y="47" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8A99AD" letter-spacing="0.5">MACHINE LEARNING</text>
    <text x="20" y="70" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00F0FF" opacity="0.9">DATA PIPELINES &amp; ANALYTICS</text>
  </g>

  <!-- Right Tech Panel: COMPUTER ENGINEERING -->
  <g transform="translate(905, 45)">
    <rect x="0" y="0" width="240" height="85" rx="8" fill="url(#glassFill)" stroke="#7000FF" stroke-opacity="0.35" stroke-width="1" />
    <path d="M 240,0 L 222,0 L 240,18 Z" fill="#FF007F" opacity="0.9" />

    <!-- Circular Gauge Graphic -->
    <g transform="translate(30, 42)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#FF007F" stroke-width="1.2" stroke-dasharray="8 4" class="reticle-spin" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#00F0FF" stroke-width="1" />
      <circle cx="0" cy="0" r="3" fill="#7000FF" />
    </g>

    <text x="58" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00F0FF" font-weight="700" letter-spacing="1">ARCH.COMP_ENG</text>
    <text x="58" y="47" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8A99AD" letter-spacing="0.5">SOFTWARE ARCHITECTURE</text>
    <text x="20" y="70" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FF007F" opacity="0.9">MLOPS &amp; CI/CD PIPELINES</text>
  </g>

  <!-- Central Title & Cyberpunk Badge Block -->
  <g class="title-animated">
    <!-- Top Micro Tagline -->
    <g transform="translate(600, 42)">
      <rect x="-160" y="-12" width="320" height="20" rx="10" fill="#09101F" fill-opacity="0.8" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" />
      <text x="0" y="2" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00F0FF" font-weight="700" letter-spacing="3">✦ HIGH-PERFORMANCE DATA &amp; AI ✦</text>
    </g>

    <!-- Main Title: LUCENFORT -->
    <!-- Background Hologram Shadow -->
    <text x="598" y="98" text-anchor="middle" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="48" font-weight="900" fill="#FF007F" letter-spacing="16" opacity="0.3" filter="url(#glowPink)">LUCENFORT</text>
    <text x="602" y="98" text-anchor="middle" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="48" font-weight="900" fill="#00F0FF" letter-spacing="16" opacity="0.3" filter="url(#glowCyan)">LUCENFORT</text>
    
    <!-- Primary Crisp Text -->
    <text x="600" y="98" text-anchor="middle" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="48" font-weight="900" fill="#FFFFFF" letter-spacing="16">LUCENFORT</text>

    <!-- Subtitle Capsule -->
    <g transform="translate(600, 138)">
      <rect x="-150" y="-14" width="300" height="28" rx="14" fill="#0B1324" fill-opacity="0.9" stroke="url(#neonGradient)" stroke-width="1.2" filter="url(#glowCyan)" />
      <circle cx="-130" cy="0" r="4" fill="#00FF9D" class="blink" />
      <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="700" letter-spacing="4">COMPUTER ENGINEER</text>
      <circle cx="130" cy="0" r="4" fill="#00F0FF" class="blink" />
    </g>
  </g>

  <!-- Bottom Tech Connector Edge Lines -->
  <path d="M 80,178 L 1120,178" stroke="url(#neonGradient)" stroke-width="2" filter="url(#glowCyan)" />
  <circle cx="600" cy="178" r="5" fill="#00F0FF" filter="url(#glowCyan)" />
  <circle cx="300" cy="178" r="3.5" fill="#7000FF" />
  <circle cx="900" cy="178" r="3.5" fill="#FF007F" />
</svg>