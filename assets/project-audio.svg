<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgAudio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D18" />
      <stop offset="100%" stop-color="#0E1626" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes eq1 { 0%, 100% { height: 12px; y: 24px; } 50% { height: 32px; y: 14px; } }
      @keyframes eq2 { 0%, 100% { height: 28px; y: 16px; } 50% { height: 10px; y: 25px; } }
      @keyframes eq3 { 0%, 100% { height: 18px; y: 21px; } 50% { height: 36px; y: 12px; } }
      @keyframes eq4 { 0%, 100% { height: 34px; y: 13px; } 50% { height: 14px; y: 23px; } }
      .bar1 { animation: eq1 1.2s ease-in-out infinite; }
      .bar2 { animation: eq2 0.9s ease-in-out infinite; }
      .bar3 { animation: eq3 1.4s ease-in-out infinite; }
      .bar4 { animation: eq4 1.1s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="400" height="100" rx="8" fill="url(#bgAudio)" stroke="url(#neonCyan)" stroke-width="1.2" stroke-opacity="0.8" />

  <!-- Glass HUD Border Accent -->
  <path d="M 0,0 L 20,0 L 0,20 Z" fill="#00F0FF" opacity="0.8" />
  <path d="M 400,100 L 380,100 L 400,80 Z" fill="#7000FF" opacity="0.8" />

  <!-- Animated Frequency Analyzer Icon -->
  <g fill="#00F0FF" filter="url(#glow)" transform="translate(30, 25)">
    <rect x="0" y="24" width="4" height="12" rx="2" class="bar1" />
    <rect x="8" y="16" width="4" height="28" rx="2" class="bar2" />
    <rect x="16" y="21" width="4" height="18" rx="2" fill="#7000FF" class="bar3" />
    <rect x="24" y="13" width="4" height="34" rx="2" class="bar4" />
    <rect x="32" y="20" width="4" height="20" rx="2" class="bar1" />
  </g>

  <!-- Title & Subtitle -->
  <text x="90" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" letter-spacing="1">DETECÇÃO DE FALHAS EM ÁUDIO</text>
  <text x="90" y="64" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00F0FF" letter-spacing="0.5">SINAIS ACÚSTICOS // MACHINE LEARNING</text>
</svg>
