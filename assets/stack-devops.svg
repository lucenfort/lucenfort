<svg width="1200" height="90" viewBox="0 0 1200 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradDevOps" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040D14" />
      <stop offset="100%" stop-color="#091624" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="90" rx="8" fill="url(#bgGradDevOps)" stroke="url(#neonGreen)" stroke-width="1.2" stroke-opacity="0.7" />

  <!-- Corner Tech Accent -->
  <path d="M 0,0 L 20,0 L 0,20 Z" fill="#00FF9D" opacity="0.8" />
  <path d="M 1200,90 L 1180,90 L 1200,70 Z" fill="#00F0FF" opacity="0.8" />

  <!-- Category Title -->
  <text x="30" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00FF9D" font-weight="700" letter-spacing="2">[ 03 // DEVOPS, MLOPS &amp; ARQUITETURA ]</text>

  <!-- Tech Badges / Pills -->
  <g transform="translate(30, 44)">
    <!-- Docker -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="120" height="32" rx="6" fill="#0A1828" stroke="#2496ED" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#2496ED" filter="url(#glowGreen)" />
      <text x="30" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="700">Docker</text>
    </g>

    <!-- Kubernetes -->
    <g transform="translate(135, 0)">
      <rect x="0" y="0" width="150" height="32" rx="6" fill="#0A1828" stroke="#326CE5" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#326CE5" filter="url(#glowGreen)" />
      <text x="30" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="700">Kubernetes</text>
    </g>

    <!-- CI/CD (GitHub Actions) -->
    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="120" height="32" rx="6" fill="#0A1828" stroke="#2088FF" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#2088FF" filter="url(#glowGreen)" />
      <text x="30" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="700">CI/CD</text>
    </g>

    <!-- MLOps -->
    <g transform="translate(435, 0)">
      <rect x="0" y="0" width="120" height="32" rx="6" fill="#0A1828" stroke="#0194E2" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#0194E2" filter="url(#glowGreen)" />
      <text x="30" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="700">MLOps</text>
    </g>

    <!-- IoT & Embedded -->
    <g transform="translate(570, 0)">
      <rect x="0" y="0" width="150" height="32" rx="6" fill="#0A1828" stroke="#00979D" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#00FF9D" filter="url(#glowGreen)" />
      <text x="30" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="700">IoT &amp; Hardware</text>
    </g>
  </g>
</svg>
