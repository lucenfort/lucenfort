<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgQuantum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#190B28" />
    </linearGradient>
    <linearGradient id="neonCyanMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes orbitSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .spin-orbit { animation: orbitSpin 6s linear infinite; transform-origin: 20px 20px; }
      .spin-orbit-rev { animation: orbitSpin 9s linear infinite reverse; transform-origin: 20px 20px; }
    </style>
  </defs>

  <rect width="400" height="100" rx="8" fill="url(#bgQuantum)" stroke="url(#neonCyanMagenta)" stroke-width="1.2" stroke-opacity="0.8" />

  <!-- Glass HUD Border Accent -->
  <path d="M 0,0 L 20,0 L 0,20 Z" fill="#00F0FF" opacity="0.8" />
  <path d="M 400,100 L 380,100 L 400,80 Z" fill="#FF007F" opacity="0.8" />

  <!-- Animated Qubit Bloch Orbital Graphic -->
  <g transform="translate(30, 25)">
    <ellipse cx="20" cy="20" rx="18" ry="7" fill="none" stroke="#00F0FF" stroke-width="1.2" class="spin-orbit" filter="url(#glowCyan)" />
    <ellipse cx="20" cy="20" rx="18" ry="7" fill="none" stroke="#FF007F" stroke-width="1.2" class="spin-orbit-rev" filter="url(#glowCyan)" />
    <circle cx="20" cy="20" r="5" fill="#7000FF" />
    <circle cx="20" cy="20" r="2" fill="#FFFFFF" />
  </g>

  <!-- Title & Subtitle -->
  <text x="90" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" letter-spacing="1">TELETRANSPORTE QUÂNTICO</text>
  <text x="90" y="64" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00F0FF" letter-spacing="0.5">COMPUTAÇÃO QUÂNTICA // QISKIT</text>
</svg>
