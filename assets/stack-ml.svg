<svg width="1200" height="90" viewBox="0 0 1200 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradML" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A16" />
      <stop offset="100%" stop-color="#140B24" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="90" rx="8" fill="url(#bgGradML)" stroke="url(#neonPink)" stroke-width="1.2" stroke-opacity="0.7" />

  <!-- Corner Tech Accent -->
  <path d="M 0,0 L 20,0 L 0,20 Z" fill="#FF007F" opacity="0.8" />
  <path d="M 1200,90 L 1180,90 L 1200,70 Z" fill="#7000FF" opacity="0.8" />

  <!-- Category Title -->
  <text x="30" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FF007F" font-weight="700" letter-spacing="2">[ 02 // MACHINE LEARNING &amp; DEEP LEARNING ]</text>

  <!-- Tech Badges / Pills -->
  <g transform="translate(30, 44)">
    <!-- PyTorch -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="130" height="32" rx="6" fill="#140D20" stroke="#EE4C2C" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#EE4C2C" filter="url(#glowPink)" />
      <text x="30" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="700">PyTorch</text>
    </g>

    <!-- TensorFlow -->
    <g transform="translate(145, 0)">
      <rect x="0" y="0" width="150" height="32" rx="6" fill="#140D20" stroke="#FF6F00" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#FF6F00" filter="url(#glowPink)" />
      <text x="30" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="700">TensorFlow</text>
    </g>

    <!-- Scikit-Learn -->
    <g transform="translate(310, 0)">
      <rect x="0" y="0" width="160" height="32" rx="6" fill="#140D20" stroke="#F7931E" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#F7931E" filter="url(#glowPink)" />
      <text x="30" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="700">Scikit-Learn</text>
    </g>

    <!-- OpenCV -->
    <g transform="translate(485, 0)">
      <rect x="0" y="0" width="130" height="32" rx="6" fill="#140D20" stroke="#5C3EE8" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#00F0FF" filter="url(#glowPink)" />
      <text x="30" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="700">OpenCV</text>
    </g>
  </g>
</svg>
