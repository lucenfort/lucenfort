<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgNautical" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060E1A" />
      <stop offset="100%" stop-color="#0B172C" />
    </linearGradient>
    <linearGradient id="neonMarine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <filter id="glowMarine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes pulseRing {
        0% { r: 6px; opacity: 0.9; }
        50% { r: 16px; opacity: 0.3; }
        100% { r: 6px; opacity: 0.9; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .ring1 { animation: pulseRing 2.4s ease-in-out infinite; }
      .radar { animation: radarSweep 4s linear infinite; transform-origin: 45px 50px; }
    </style>
  </defs>

  <rect width="400" height="100" rx="8" fill="url(#bgNautical)" stroke="url(#neonMarine)" stroke-width="1.2" stroke-opacity="0.9" />

  <!-- Glass HUD Border Accent -->
  <path d="M 0,0 L 20,0 L 0,20 Z" fill="#00F0FF" opacity="0.85" />
  <path d="M 400,100 L 380,100 L 400,80 Z" fill="#0066FF" opacity="0.85" />

  <!-- Animated Nautical Radar / Compass & Data Nodes -->
  <g filter="url(#glowMarine)">
    <circle cx="45" cy="50" r="20" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    <circle cx="45" cy="50" r="10" fill="none" stroke="#0066FF" stroke-width="1.2" class="ring1" />
    <circle cx="45" cy="50" r="3" fill="#00F0FF" />
    <line x1="45" y1="50" x2="45" y2="30" stroke="#00F0FF" stroke-width="1.5" class="radar" />
  </g>

  <!-- Title & Subtitle -->
  <text x="90" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="1">LH NAUTICAL PLATFORM</text>
  <text x="90" y="64" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00F0FF" letter-spacing="0.5">DATA ENG // TIME SERIES // RECSYS</text>
</svg>
